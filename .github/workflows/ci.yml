# Quality gate for every PR (forks included) and every push to master.
# Runs with a read-only token and no secrets, so it is safe on fork PRs.

name: ci
on:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm run --if-present test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Skips cleanly until a Playwright config exists in the repo.
      - id: detect
        run: |
          if [ -f playwright.config.ts ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No playwright.config.ts, skipping e2e."
          fi
      - if: steps.detect.outputs.enabled == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.detect.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.detect.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.detect.outputs.enabled == 'true'
        run: pnpm run test:e2e
